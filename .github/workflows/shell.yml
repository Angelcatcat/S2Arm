name: Build iOS shell

# 用途：在 macOS runner 上跑 pack/shell_build.sh，产出「预编壳」（root/ + manifest.json）。
#
# 为什么只能在 macOS：壳要 Xcode（iOS SDK + Metal 编译器）、codesign、GNU Make ≥ 4、.NET 10 SDK；
#   pack/shell_build.sh 第 17 行门禁、第 20/22 行 SDK 主版本校验都依赖这些工具。
#
# 产物用法（解压出 root/ 与 manifest.json 后，三选一）：
#   ① 启动器资源目录 Shell/              → pack/jobs/ipa.py: bundled_shell() 读它
#   ② <S2A_RUN_ROOT>/s2arm/cache/shell/<shellId>/  → pack/ipa.sh 按目录名找
#   ③ 任意目录 + 环境变量 S2A_SHELL=<该目录>
#
# 前置条件（工作流本身不解决）：
#   - 仓库已有远端并 push：壳编号按 HEAD 上输入表的对象哈希算，工作区必须干净（shell_build.sh:17）
#   - pack/stage_inputs/shell.tsv 必须是 LF + Tab：CRLF 会让第 15 行的 awk 解析失败
#   - runner 上的 iOS SDK 大版本要等于 tools/toolchain.env 的 IPHONEOS_SDK_MAJOR（当前 27）

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'pack/shell_build.sh'
      - 'pack/shell/**'
      - 'pack/stage_inputs/shell.tsv'
      - 'pack/ship_ext.py'
      - 'pack/app_bundle.py'
      - 'pack/app.entitlements'
      - 'runtime/**'
      - 'services/**'
      - 'graphics/metal/**'
      - 'graphics/nvn/**'
      - 'graphics/dsx/**'
      - 'platform/**'
      - 'ios/**'
      - 'tools/**'
      - 'Makefile'
      - '.github/workflows/shell.yml'

concurrency:
  group: shell-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'

    steps:
      - name: 取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: 环境自检（打印，不判红）
        run: |
          set -uo pipefail
          uname -a
          sw_vers || true
          df -h / | tail -1
          echo "--- Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "（/Applications 下没有 Xcode）"
          xcodebuild -version || true
          xcode-select -p || true
          echo "--- SDK ---"
          xcrun --sdk iphoneos --show-sdk-version || true
          xcrun -sdk iphoneos metal --version 2>&1 | head -3 || true
          echo "--- 工具 ---"
          bash --version | head -1
          (command -v gmake && gmake --version | head -1) || echo "（没有 gmake）"
          python3 --version || true
          (dotnet --list-sdks) || echo "（PATH 里没有 dotnet）"

      - name: 解析工具链并核 SDK 主版本
        run: |
          set +e   # runner 默认 bash -e：这里必须关掉，任何一步失败都要留下可读的 ::error::
          set -uo pipefail
          LOG="$RUNNER_TEMP/tc.log"
          TRACE="$RUNNER_TEMP/trace.log"
          exec 2> "$TRACE"   # 本步 stderr 全进 trace.log（macOS bash 3.2 不认 BASH_XTRACEFD）
          set -x

          # 用项目自己的解析器（tools/toolchain.sh：装着的 Xcode 里最新的一个，并核 iOS SDK + Metal 编译器）
          source tools/toolchain.sh > "$LOG" 2>&1
          RC=$?
          cat "$LOG"
          echo "::warning::S4a rc=$RC sdk=${S2A_TC_SDK:-none} dd=${DEVELOPER_DIR:-none}"
          if [ $RC -ne 0 ] || [ -z "${S2A_TC_SDK:-}" ] || [ -z "${DEVELOPER_DIR:-}" ]; then
            echo "::error::工具链解析失败（rc=${RC}）：$(tail -3 "$LOG" 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi

          SDKV="$S2A_TC_SDK"
          printf 'SDK_ACTUAL=%s\nS2A_XCODE=%s\nS2A_DEVELOPER_DIR=%s\nDEVELOPER_DIR=%s\n' \
            "$SDKV" "$DEVELOPER_DIR" "$DEVELOPER_DIR" "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          MAJOR=${SDKV%%.*}

          WANT=$(awk -F= '$1 == "IPHONEOS_SDK_MAJOR" { print $2 }' tools/toolchain.env)
          echo "::warning::S4b sdkv=$SDKV major=$MAJOR want=$WANT"
          echo "runner iOS SDK=${SDKV}（主版本 ${MAJOR}），tools/toolchain.env 里是 ${WANT}"

          # 壳编号记的是「实际链接用的 SDK 主版本」。不一致就在这里报红，不做静默改写：
          # 改 toolchain.env 会换壳编号，必须由人决定并提交（出包机的 env 也得同步）。
          if [ "$MAJOR" != "$WANT" ]; then
            echo "::error::SDK 主版本不符：runner=${MAJOR} / tools/toolchain.env=${WANT}。把 tools/toolchain.env 的 IPHONEOS_SDK_MAJOR 改成 ${MAJOR} 并提交后重跑（壳编号会变，出包机同步）"
            exit 1
          fi
          echo "::warning::S4c end"
          exit 0

      - name: 补装 Metal Toolchain（缺才装）
        run: |
          set -uo pipefail
          if xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "Metal 编译器已就绪"; xcrun -sdk iphoneos metal --version | head -1; exit 0
          fi
          echo "缺 Metal 编译器，尝试 xcodebuild -downloadComponent MetalToolchain"
          sudo xcodebuild -downloadComponent MetalToolchain || true
          if ! xcrun -sdk iphoneos metal --version >/dev/null 2>&1; then
            echo "::error::runner 缺 Metal Toolchain 且自动下载失败（Xcode → Settings → Components 手动装）"
            exit 1
          fi
          xcrun -sdk iphoneos metal --version | head -1

      - name: 装 GNU Make ≥ 4 与较新的 bash
        run: |
          set -euo pipefail
          brew install make bash
          GM="$(command -v gmake || true)"
          [ -n "$GM" ] || GM="$(brew --prefix)/bin/gmake"
          "$GM" --version | head -1 | grep -qE 'GNU Make ([4-9]|[1-9][0-9])\.' \
            || { echo "::error::gmake 版本不足 4"; exit 1; }
          echo "S2A_GMAKE=$GM" >> "$GITHUB_ENV"
          BASH5="$(brew --prefix)/bin/bash"
          [ -x "$BASH5" ] && echo "BASH5=$BASH5" >> "$GITHUB_ENV" || true

      - name: 装 .NET 10 SDK（官方，NativeAOT 要用）
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/.dotnet"
          "$HOME/.dotnet/dotnet" --version
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          # pack/services/nxaot.sh 缺省就找 $HOME/.dotnet/dotnet，这里显式给一份
          echo "DOTNET=$HOME/.dotnet/dotnet" >> "$GITHUB_ENV"

      - name: 腾空间（删 Android SDK 与没用到的 Xcode）
        run: |
          set -uo pipefail
          sudo rm -rf "${ANDROID_HOME:-/Users/runner/Library/Android/sdk}" "${ANDROID_SDK_ROOT:-}" 2>/dev/null || true
          KEEP=$(cd "${S2A_XCODE}/../.." && pwd -P)   # 选中的那个 Xcode 的真实路径
          for app in /Applications/Xcode*.app; do
            [ "$(cd "$app" && pwd -P)" = "$KEEP" ] && continue
            sudo rm -rf "$app"
          done
          echo "保留 $KEEP"
          df -h / | tail -1

      - name: 预检（工作区干净 / 输入表可解析）
        run: |
          set -euo pipefail

          # 1) 从 Windows 提交的仓库：确认脚本 / 输入表没被 autocrlf 改成 CRLF
          BAD=$(LC_ALL=C grep -rl $'\r' --include='*.sh' --include='*.mk' --include='*.tsv' pack tools runtime graphics platform ios services Makefile 2>/dev/null | head -20 || true)
          if [ -n "$BAD" ]; then
            echo "::error::下面这些文件含 CRLF，bash/make/awk 会直接报错（Windows 提交时 core.autocrlf=true 造成）"
            echo "$BAD"
            echo "修法：git config core.autocrlf false，把这些文件转回 LF 后重新提交"
            exit 1
          fi

          # 2) shell.tsv 必须能按 "入<TAB>路径" 解析（shell_build.sh:15）
          if LC_ALL=C grep -q $'\r' pack/stage_inputs/shell.tsv; then
            echo "::error::pack/stage_inputs/shell.tsv 含 CRLF"
            exit 1
          fi
          N=$(awk -F'\t' '$1 == "入" { n++ } END { print n + 0 }' pack/stage_inputs/shell.tsv)
          [ "$N" -gt 0 ] || { echo "::error::shell.tsv 里解析不到「入」行（$N 条），门禁会直接报红"; exit 1; }
          echo "输入表可解析：$N 条"

          # 3) shell_build.sh:17 —— $IN 与 shell.tsv 不许有未提交改动
          IN=$(awk -F'\t' '$1 == "入" { print $2 }' pack/stage_inputs/shell.tsv)
          DIRTY=$(git status --porcelain -- $IN pack/stage_inputs/shell.tsv || true)
          if [ -n "$DIRTY" ]; then
            echo "::error::壳输入表范围内的文件有未提交改动（shell_build.sh:17 会拒）"
            echo "$DIRTY"
            echo "先把这些改动提交并 push，再重跑本工作流"
            exit 1
          fi
          echo "工作区（输入表范围）干净"

      - name: 预编 C# 静态库（NativeAOT，单独跑，失败原因看得见）
        run: |
          set +e
          set -uo pipefail
          O="$RUNNER_TEMP/nxaot.out"; E="$RUNNER_TEMP/nxaot.err"
          bash services/nxaot.sh ios-arm64 > "$O" 2> "$E"
          RC=$?
          echo "----- stderr -----"; tail -8 "$E"
          echo "----- stdout -----"; tail -2 "$O"
          if [ $RC -ne 0 ]; then
            tail -6 "$E" | cut -c1-300 | while IFS= read -r l; do
              [ -n "$l" ] || continue
              echo "::error::nxaot: ${l}"
            done
            for p in "$HOME"/.s2arm/run/s2arm/cache/nxaot/*.tmp/publish.log; do
              [ -f "$p" ] || continue
              echo "---- ${p}"
              grep -a -iE 'error|not found|could not|MSB[0-9]|NU[0-9]' "$p" | head -3 | cut -c1-300 | while IFS= read -r l; do
                echo "::error::publish: ${l}"
              done
              echo "::error::publish-tail: $(tail -8 "$p" | tr '\n' '|' | cut -c1-900)"
            done
            exit 1
          fi
          exit 0

      - name: 出壳
        run: |
          set +e
          set -uo pipefail
          OUT="$RUNNER_TEMP/shell"
          LOG="$RUNNER_TEMP/shell_build.log"
          rm -rf "$OUT"
          export S2A_PY=python3
          echo "工具链：Xcode=${S2A_XCODE:-?} SDK=${SDK_ACTUAL:-?} gmake=${S2A_GMAKE:-?}"
          "${BASH5:-bash}" pack/shell_build.sh "$OUT" > "$LOG" 2>&1
          RC=$?
          tail -40 "$LOG"
          if [ $RC -ne 0 ]; then
            # 【红】行 + 真正的编译错误都转成 ::error:: 注解（run 页匿名可见）
            grep -a '【红】' "$LOG" | tail -3 | cut -c1-280 | while IFS= read -r line; do
              echo "::error::shell_build: ${line}"
            done
            grep -a -iE 'error:|\*\*\* |No such file|cannot find|not found' "$LOG" | tail -6 | cut -c1-280 | while IFS= read -r line; do
              echo "::error::tail: ${line}"
            done
            exit 1
          fi
          exit 0

      - name: 失败时导出 C#/dotnet 日志
        if: failure()
        run: |
          set +e
          set -uo pipefail
          shopt -s nullglob
          FOUND=0
          for f in "$HOME"/.s2arm/run/s2arm/cache/nxaot/*.tmp/publish.log \
                   "$HOME"/.s2arm/run/s2arm/cache/nxaot/*/publish.log; do
            FOUND=1
            echo "===== $f"
            grep -a -iE 'error|not found|失败|MSB[0-9]+|NU[0-9]+|could not' "$f" | head -5 | cut -c1-260 | while IFS= read -r line; do
              echo "::error::nxaot: ${line}"
            done
          done
          [ "$FOUND" = 1 ] || echo "::warning::缓存目录里没有 publish.log"
          echo "===== 缓存目录"
          ls -1 "$HOME"/.s2arm/run/s2arm/cache/nxaot 2>/dev/null | head -10
          echo "===== nuget 源"
          "${DOTNET:-dotnet}" nuget list source 2>&1 | head -8

      - name: 核壳并取壳编号
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/shell"
          [ -f "$OUT/manifest.json" ] || { echo "::error::没产出 manifest.json"; exit 1; }
          [ -d "$OUT/root" ] || { echo "::error::没产出 root/"; exit 1; }

          python3 -m pack.shell.manifest verify --root "$OUT/root" --manifest "$OUT/manifest.json"
          SID=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['details']['shellId'])" "$OUT/manifest.json")
          echo "shellId=$SID"
          echo "SID=$SID" >> "$GITHUB_ENV"
          du -sh "$OUT" "$OUT/root"

      - name: 打包 artifact（tar.gz 保权限）
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/shell"
          cd "$RUNNER_TEMP"
          tar -czf "shell-$SID.tar.gz" -C "$OUT" root manifest.json
          shasum -a 256 "shell-$SID.tar.gz" | tee "shell-$SID.tar.gz.sha256"
          ls -lh "shell-$SID.tar.gz"

      - name: 写环境快照（失败也能取回，便于诊断）
        if: always()
        run: |
          set -uo pipefail
          E="$RUNNER_TEMP/env.txt"
          {
            echo "== runner =="; uname -a; sw_vers 2>/dev/null
            echo "== Xcode =="; ls -d /Applications/Xcode*.app 2>/dev/null; xcode-select -p 2>/dev/null
            xcodebuild -version 2>&1 | head -2
            echo "== iOS SDK =="; echo "actual=${SDK_ACTUAL:-?}"; awk -F= '$1=="IPHONEOS_SDK_MAJOR"{print "toolchain.env="$2}' tools/toolchain.env 2>/dev/null
            echo "== Metal =="; xcrun -sdk iphoneos metal --version 2>&1 | head -2
            echo "== tools =="; bash --version | head -1; gmake --version 2>/dev/null | head -1
            "${DOTNET:-dotnet}" --list-sdks 2>/dev/null | tail -3
            echo "== disk =="; df -h / | tail -1
            echo "== git =="; git rev-parse HEAD 2>/dev/null; git status --porcelain 2>/dev/null | head -20
          } > "$E" 2>&1 || true
          cat "$E"

          # 关键信息同时打成 ::warning::（注解在 run 页匿名可见，失败时不用登录也能定位）
          NX=$(ls -d /Applications/Xcode*.app 2>/dev/null | wc -l | tr -d ' ')
          METAL=$(xcrun -sdk iphoneos metal --version >/dev/null 2>&1 && echo ok || echo no)
          DN=$("${DOTNET:-dotnet}" --list-sdks 2>/dev/null | wc -l | tr -d ' ')
          echo "::warning::ENV xcodes=$NX sdk=${SDK_ACTUAL:-none} metal=$METAL dotnetsdks=$DN xcode=${S2A_XCODE:-none}"
          awk -F= '$1=="IPHONEOS_SDK_MAJOR"{print "::warning::WANT raw=[" $2 "]"}' tools/toolchain.env 2>/dev/null | cat -v
          if [ -f "$RUNNER_TEMP/tc.log" ]; then
            tail -2 "$RUNNER_TEMP/tc.log" | while IFS= read -r l; do echo "::warning::TC $l"; done
          fi
          if [ -f "$RUNNER_TEMP/trace.log" ]; then
            tail -6 "$RUNNER_TEMP/trace.log" | while IFS= read -r l; do echo "::warning::T $l"; done
          fi

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shell-${{ env.SID || 'none' }}
          path: |
            ${{ runner.temp }}/shell-*.tar.gz
            ${{ runner.temp }}/shell-*.tar.gz.sha256
            ${{ runner.temp }}/env.txt
            ${{ runner.temp }}/shell_build.log
            ${{ runner.temp }}/tc.log
          retention-days: 14
          if-no-files-found: warn

      - name: 写摘要
        if: always()
        run: |
          {
            echo "## 预编壳"
            echo
            if [ -n "${SID:-}" ]; then
              echo "- shellId：\`$SID\`"
              echo "- artifact：\`shell-$SID\`（tar.gz，内含 \`root/\` 与 \`manifest.json\`）"
              echo "- Xcode：\`${S2A_XCODE}\`"
              echo "- iOS SDK：\`${SDK_ACTUAL:-?}\`（壳的 iosSdk 就是这个大版本，出包机必须一致）"
              echo
              echo "### 拿到壳之后（Windows 侧）"
              echo
              echo '1. 解压，得到 `root/` 与 `manifest.json`'
              echo "2. 落到下面任一位置，目录名用 shellId："
              echo '   - 启动器资源目录 `Shell/`'
              echo "   - \`<S2A_RUN_ROOT>/s2arm/cache/shell/$SID/\`"
              echo '   - 任意目录 + `set S2A_SHELL=<该目录>`'
              echo "3. 若源码树里有 \`engine.json\`，把它的 \`shellId\` 改成 \`$SID\`（pack/shell/manifest.py current_id 读它）"
              echo "4. 出包机的 \`tools/toolchain.env\` 的 \`IPHONEOS_SDK_MAJOR\` 必须等于 \`${SDK_ACTUAL%%.*}\`，否则装配时壳编号对不上"
            else
              echo "本次没有产出壳。取 artifact \`shell-none\` 里的 \`env.txt\` 看环境（Xcode / SDK / Metal / gmake / dotnet）。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
